<svg width="800" height="500" viewBox="0 0 800 500" fill="none" xmlns="http://www.w3.org/2000/svg">
    <rect width="800" height="500" fill="#0B1219"/>
    <defs>
      <pattern id="grid-cms" width="32" height="32" patternUnits="userSpaceOnUse">
        <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#17232F" stroke-width="0.5"/>
      </pattern>
      <linearGradient id="glow-cms" x1="100" y1="50" x2="700" y2="450" gradientUnits="userSpaceOnUse">
        <stop stop-color="#2563EB" stop-opacity="0.25"/>
        <stop offset="1" stop-color="#0B1219" stop-opacity="0"/>
      </linearGradient>
    </defs>
    <rect width="800" height="500" fill="url(#grid-cms)"/>
    <rect width="800" height="500" fill="url(#glow-cms)"/>

    <!-- Browser Window Mockup -->
    <g transform="translate(60, 45)">
      <rect width="680" height="390" rx="12" fill="#101923" stroke="#2563EB" stroke-opacity="0.3" stroke-width="1"/>
      <path d="M0 12C0 5.37258 5.37258 0 12 0H668C674.627 0 680 5.37258 680 12V36H0V12Z" fill="#17232F"/>
      <circle cx="20" cy="18" r="4" fill="#FF5F56"/>
      <circle cx="34" cy="18" r="4" fill="#FFBD2E"/>
      <circle cx="48" cy="18" r="4" fill="#27C93F"/>
      <rect x="80" y="8" width="340" height="20" rx="5" fill="#0B1219" stroke="#223344" stroke-width="1"/>
      <text x="96" y="22" font-family="monospace" font-size="9" fill="#9BB3FF">crossmotiveservices.com</text>

      <!-- App Body -->
      <rect x="0" y="36" width="130" height="354" fill="#141E28"/>
      <rect x="18" y="54" width="70" height="8" rx="2" fill="#3E5466"/>
      <rect x="18" y="74" width="94" height="18" rx="4" fill="#2563EB" fill-opacity="0.25"/>
      <rect x="28" y="79" width="60" height="8" rx="2" fill="#5C83F2"/>

      <!-- Main Stage -->
      <rect x="150" y="52" width="510" height="75" rx="8" fill="#17232F" stroke="#223344" stroke-width="1"/>
      <text x="170" y="82" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="700" fill="#FFFFFF">Cross Motive Services</text>
      <text x="170" y="103" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#9BB3FF">Full-Stack Digital Engineering &amp; Bespoke ERP Architecture</text>

      <rect x="150" y="142" width="245" height="180" rx="8" fill="#17232F" stroke="#223344" stroke-width="1"/>
      <text x="170" y="170" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#FFFFFF">100% IP &amp; Code Ownership</text>
      <text x="170" y="192" font-family="system-ui, sans-serif" font-size="11" fill="#8C9DA8">Zero vendor lock-in. Full repository transfers.</text>
      <polyline points="170,290 210,260 250,275 290,230 330,240 370,210" fill="none" stroke="#2563EB" stroke-width="3"/>

      <rect x="415" y="142" width="245" height="180" rx="8" fill="#17232F" stroke="#223344" stroke-width="1"/>
      <text x="435" y="170" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#FFFFFF">Multi-Region Cloud Edge</text>
      <text x="435" y="192" font-family="system-ui, sans-serif" font-size="11" fill="#8C9DA8">&lt;20ms latency across global endpoints.</text>
      <polyline points="435,280 475,270 515,250 555,255 595,220 635,200" fill="none" stroke="#5C83F2" stroke-width="3"/>
    </g>
</svg>