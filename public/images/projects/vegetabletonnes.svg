<svg width="800" height="500" viewBox="0 0 800 500" fill="none" xmlns="http://www.w3.org/2000/svg">
    <rect width="800" height="500" fill="#0E1612"/>
    <defs>
      <pattern id="grid-veg" width="32" height="32" patternUnits="userSpaceOnUse">
        <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#1B2821" stroke-width="0.5"/>
      </pattern>
      <linearGradient id="glow-veg" x1="100" y1="50" x2="700" y2="450" gradientUnits="userSpaceOnUse">
        <stop stop-color="#22C55E" stop-opacity="0.2"/>
        <stop offset="1" stop-color="#0E1612" stop-opacity="0"/>
      </linearGradient>
    </defs>
    <rect width="800" height="500" fill="url(#grid-veg)"/>
    <rect width="800" height="500" fill="url(#glow-veg)"/>

    <g transform="translate(60, 45)">
      <rect width="680" height="390" rx="12" fill="#131D18" stroke="#22C55E" stroke-opacity="0.25" stroke-width="1"/>
      <path d="M0 12C0 5.37258 5.37258 0 12 0H668C674.627 0 680 5.37258 680 12V36H0V12Z" fill="#1A2620"/>
      <circle cx="20" cy="18" r="4" fill="#FF5F56"/>
      <circle cx="34" cy="18" r="4" fill="#FFBD2E"/>
      <circle cx="48" cy="18" r="4" fill="#27C93F"/>
      <rect x="80" y="8" width="340" height="20" rx="5" fill="#0E1612" stroke="#27382F" stroke-width="1"/>
      <text x="96" y="22" font-family="monospace" font-size="9" fill="#86EFAC">vegetabletonnes.com</text>

      <!-- App Body -->
      <rect x="0" y="36" width="130" height="354" fill="#16221C"/>
      <rect x="18" y="54" width="70" height="8" rx="2" fill="#3D5347"/>
      <rect x="18" y="74" width="94" height="18" rx="4" fill="#22C55E" fill-opacity="0.25"/>
      <rect x="28" y="79" width="60" height="8" rx="2" fill="#22C55E"/>

      <!-- Main Stage -->
      <rect x="150" y="52" width="510" height="75" rx="8" fill="#1A2620" stroke="#2D4035" stroke-width="1"/>
      <text x="170" y="82" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="700" fill="#FFFFFF">Vegetable Tonnes</text>
      <text x="170" y="103" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#86EFAC">B2B Wholesale Agritech &amp; Farm Supply Chain Platform</text>

      <rect x="150" y="142" width="245" height="180" rx="8" fill="#1A2620" stroke="#2D4035" stroke-width="1"/>
      <text x="170" y="170" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#FFFFFF">Daily Mandi Bulk Rates</text>
      <text x="170" y="192" font-family="system-ui, sans-serif" font-size="11" fill="#98A9A0">Real-time dynamic pricing per quintal &amp; tonne.</text>
      <polyline points="170,290 210,265 250,280 290,225 330,235 370,195" fill="none" stroke="#22C55E" stroke-width="3"/>

      <rect x="415" y="142" width="245" height="180" rx="8" fill="#1A2620" stroke="#2D4035" stroke-width="1"/>
      <text x="435" y="170" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#FFFFFF">Fleet &amp; Dispatch Tracking</text>
      <text x="435" y="192" font-family="system-ui, sans-serif" font-size="11" fill="#98A9A0">Automated truck manifests and cold-chain routing.</text>
      <polyline points="435,275 475,255 515,265 555,230 595,215 635,185" fill="none" stroke="#86EFAC" stroke-width="3"/>
    </g>
